<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>何氏族譜文獻</title>
  <style>
    :root {
      --bg: #f7f4ee;
      --card: #fffdf9;
      --text: #222222;
      --muted: #666666;
      --line: #ddd6c8;
      --accent: #7a4b2a;
      --accent-hover: #5f391f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.8;
      font-size: 20px;
    }

    .wrap {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px;
    }

    header {
      background: var(--card);
      border-bottom: 1px solid var(--line);
      padding: 32px 24px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 2rem;
      line-height: 1.3;
    }

    .subtitle {
      color: var(--muted);
      margin: 0;
      font-size: 1.05rem;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 24px;
      margin-top: 24px;
    }

    h2 {
      margin-top: 0;
      font-size: 1.4rem;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 16px;
    }

    a.button {
      display: block;
      text-decoration: none;
      background: var(--accent);
      color: #ffffff;
      padding: 18px 20px;
      border-radius: 10px;
      text-align: center;
      font-weight: bold;
      min-height: 60px;
    }

    a.button:hover {
      background: var(--accent-hover);
    }

    ul {
      padding-left: 1.2em;
    }

    footer {
      color: var(--muted);
      font-size: 0.95rem;
      padding: 24px 0 40px;
    }

    @media (max-width: 700px) {
      body { font-size: 18px; }
      h1 { font-size: 1.7rem; }
      .buttons { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <h1>何氏族譜文獻網站</h1>
      <p class="subtitle">整理本族古老族譜、譜序、遷徙資料與文獻影像，方便海內外親友查閱。</p>
    </div>
  </header>

  <main class="wrap">
    <section class="panel">
      <h2>網站簡介</h2>
      <p>
        本網站用來整理及展示何氏相關族譜文獻，包括古老譜冊、序文、碑文、文字整理稿及白話解說。
        現階段先提供基本瀏覽入口，後續會逐步補充各房支資料、文件影像及相關說明。
      </p>
    </section>

    <section class="panel">
      <h2>瀏覽入口</h2>
      <div class="buttons">
        <a class="button" href="#">族譜總覽</a>
        <a class="button" href="#">譜序與碑文</a>
        <a class="button" href="#">文獻影像</a>
        <a class="button" href="#">白話解說</a>
      </div>
    </section>

    <section class="panel">
      <h2>說明</h2>
      <ul>
        <li>本網站內容以歷史文獻整理為主。</li>
        <li>部分文字仍在校對中，如有疑字，會逐步修訂。</li>
        <li>如宗親對資料有補充，可日後再加入聯絡方式。</li>
      </ul>
    </section>

    <footer>
      本頁為試行版本，後續將逐步增補族譜資料與分類頁面。
    </footer>
  </main>
</body>
</html>
